<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escrow Setup System v7.0</title>
  <style>
    /* Minimal styles for iframe content */
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      background: #f7f7fb;
      color: #111;
    }
    
    .section {
      background: #fff;
      border: 1px solid #dcdfe5;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }
    
    h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    h3 {
      margin: 12px 0 8px 0;
      font-size: 16px;
      font-weight: 600;
      color: #374151;
    }
    
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      border: 1px solid #dcdfe5;
      background: white;
      color: #111;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.15s;
      text-decoration: none;
    }
    
    .btn:hover {
      background: #f5f5ff;
    }
    
    .btn.primary {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }
    
    .btn.primary:hover {
      background: #4338ca;
    }
    
    .btn.danger {
      color: #b91c1c;
      background: #fff3f3;
      border-color: #f3d1d1;
    }
    
    .btn.danger:hover {
      background: #fee2e2;
    }
    
    input, select, textarea {
      width: 100%;
      border: 1px solid #dcdfe5;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    
    input:focus, select:focus, textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }
    
    input[readonly] {
      background-color: #f3f4f6;
      color: #6b7280;
      cursor: not-allowed;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    
    .grid-sections {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #111;
    }
    
    .info-box {
      background: #f8f9fb;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .info-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 8px;
    }
    
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 16px;
    }
    
    .remove-btn {
      padding: 4px 8px;
      font-size: 12px;
    }
    
    .input-table {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 13px;
    }
    
    .table-header {
      padding: 8px 10px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      border-bottom: 1px solid #dcdfe5;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="escrowSetupApp">
    <div class="section">
      <h2>📄 Escrow Setup System v7.0</h2>
      <div class="btn-group">
        <button class="btn primary" onclick="escrowSetupApp.saveEscrow()">💾 Save Escrow</button>
        <input type="file" id="escrowFileInput" accept=".json" style="display:none" onchange="escrowSetupApp.loadEscrow(event)">
        <button class="btn" onclick="document.getElementById('escrowFileInput').click()">📂 Load Escrow</button>
        <input type="file" id="systemDefaultsInput" accept=".json" style="display:none" onchange="escrowSetupApp.loadSystemDefaults(event)">
        <button class="btn" onclick="document.getElementById('systemDefaultsInput').click()" title="Load System Defaults JSON">⚙️ System</button>
        <input type="file" id="clientDefaultsInput" accept=".json" style="display:none" onchange="escrowSetupApp.loadClientDefaults(event)">
        <button class="btn" onclick="document.getElementById('clientDefaultsInput').click()" title="Load Client Defaults JSON">👤 Client</button>
        <button class="btn danger" onclick="escrowSetupApp.clearAll()">🗑️ Clear All</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== ESCROW SETUP MODULE ====================
    window.escrowSetupApp = (function() {
      'use strict';
      
      // ==================== DEFAULT CONFIGURATIONS ====================
      let loadedSystemDefaults = null;
      let loadedClientDefaults = null;
      
      // Helper function to safely access client defaults
      const getClientDefault = (path, fallback = '') => {
        if (!loadedClientDefaults) return fallback;
        const keys = path.split('.');
        let value = loadedClientDefaults;
        for (const key of keys) {
          if (value && typeof value === 'object' && key in value) {
            value = value[key];
          } else {
            return fallback;
          }
        }
        return value ?? fallback;
      };
      
      // ==================== LOAD DEFAULTS FROM FILES ====================
      async function loadDefaultsFromFiles() {
        let systemLoaded = false;
        let clientLoaded = false;
        let errorMessages = [];
        
        // Load system defaults
        try {
          const response = await fetch('system-defaults.json');
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          const parsed = await response.json();
          if (parsed && parsed.dropdowns) {
            loadedSystemDefaults = parsed;
            systemLoaded = true;
            console.log('✓ System defaults loaded from system-defaults.json');
          } else {
            errorMessages.push('system-defaults.json has invalid format (missing dropdowns)');
          }
        } catch (error) {
          errorMessages.push(`system-defaults.json: ${error.message}`);
          console.error('✗ Could not load system-defaults.json:', error.message);
        }
        
        // Load client defaults
        try {
          const response = await fetch('client-defaults.json');
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          const parsed = await response.json();
          if (parsed) {
            loadedClientDefaults = parsed;
            clientLoaded = true;
            console.log('✓ Client defaults loaded from client-defaults.json');
          } else {
            errorMessages.push('client-defaults.json has invalid format');
          }
        } catch (error) {
          errorMessages.push(`client-defaults.json: ${error.message}`);
          console.error('✗ Could not load client-defaults.json:', error.message);
        }
        
        // Show error if any defaults failed to load
        if (!systemLoaded || !clientLoaded) {
          const errorMsg = 'Failed to load required configuration files:\n\n' + 
                          errorMessages.join('\n') + 
                          '\n\nPlease ensure the following files are in the same directory as this HTML file.\n\n' +
                          'Required files:\n' +
                          '- system-defaults.json\n' +
                          '- client-defaults.json\n\n' +
                          'Note: You must open this file through a web server (not file://) for automatic loading to work.\n' +
                          'Alternatively, use the "System" and "Client" buttons to manually load the files.';
          alert(errorMsg);
        }
        
        return { systemLoaded, clientLoaded };
      }
      
      // ==================== STYLE CONSTANTS ====================
      const styles = {
        infoBox: 'background:#f8f9fb;padding:12px;border-radius:8px;margin-bottom:12px',
        infoBoxLast: 'background:#f8f9fb;padding:12px;border-radius:8px',
        infoLabel: 'font-size:11px;font-weight:600;color:#6b7280;margin-bottom:8px',
        grid: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px',
        gridNarrow: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px',
        gridWide: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px',
        gridCards: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px',
        cardHeader: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e5e7eb',
        card: 'background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)',
        removeBtn: 'padding:4px 8px;font-size:12px',
        inputTable: 'width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:4px 6px;font-size:13px',
        tableHeader: 'padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:#6b7280;border-bottom:1px solid #dcdfe5'
      };
      
      // ==================== DATA MODELS ====================
      const models = {
        seller: () => ({
          name: '',
          ssn: '',
          email: '',
          phone: '',
          address: '',
          title: '',
          vesting: '',
          forwardingAddress: ''
        }),
        
        buyer: () => ({
          type: 'Individual',
          company: '',
          name: '',
          ssn: '',
          email: '',
          phone: '',
          address: '',
          title: '',
          vesting: '',
          forwardingAddress: ''
        }),
        
        agent: () => ({
          company: '',
          companyLicense: '',
          agentLicense: '',
          name: '',
          email: '',
          phone: '',
          address: ''
        }),
        
        transactionCoordinator: () => ({
          company: '',
          contact: '',
          address: '',
          email: '',
          phone: '',
          role: 'seller'
        }),
        
        lender: () => ({
          company: '',
          license: '',
          loanNumber: '',
          address: '',
          name: '',
          email: '',
          phone: '',
          processor: '',
          processorEmail: '',
          processorPhone: ''
        }),
        
        payoff: () => ({
          lender: '',
          loanNumber: '',
          instrumentNumber: '',
          recordingDate: '',
          address: '',
          name: '',
          email: '',
          phone: ''
        }),
        
        company: () => ({
          company: '',
          contact: '',
          address: '',
          email: '',
          phone: ''
        }),
        
        vendor: () => ({
          company: '',
          contact: '',
          email: '',
          phone: '',
          address: ''
        })
      };
      
      const getInitialState = () => ({
        escrowSetup: {
          escrow: {
            company: getClientDefault('escrow.company'),
            branch: getClientDefault('escrow.branch'),
            license: getClientDefault('escrow.license'),
            number: '',
            initials: getClientDefault('escrow.initials'),
            officer: getClientDefault('escrow.officer'),
            address: getClientDefault('escrow.address'),
            citystzip: getClientDefault('escrow.citystzip'),
            email: getClientDefault('escrow.email'),
            phone: getClientDefault('escrow.phone'),
            fax: getClientDefault('escrow.fax'),
            web: getClientDefault('escrow.web'),
            status: 'O',
            type: 'S',
            daysToClose: 0,
            acceptanceDate: new Date().toISOString().split('T')[0],
            openDate: new Date().toISOString().split('T')[0],
            closeDate: new Date().toISOString().split('T')[0]
          },
          property: {
            address: '',
            city: '',
            state: '',
            zip: '',
            county: '',
            apn: '',
            legalDescription: ''
          },
          participants: {
            sellers: [models.seller()],
            buyers: [models.buyer()],
            sellerAgents: [models.agent()],
            buyerAgents: [models.agent()],
            transactionCoordinators: []
          },
          lenders: [models.lender()],
          loanBrokers: [models.lender()],
          title: {
            company: '',
            policyNumber: '',
            address: '',
            titleOfficer: '',
            email: '',
            phone: '',
            titleRep: '',
            titleRepEmail: '',
            titleRepPhone: ''
          },
          hoa: {
            hoaName: '',
            management: '',
            referenceNumber: '',
            address: '',
            name: '',
            email: '',
            phone: ''
          },
          insurance: {
            company: '',
            policyNumber: '',
            address: '',
            name: '',
            email: '',
            phone: ''
          },
          payoffs: [models.payoff()],
          nhdCompany: models.company(),
          homeWarranty: models.company(),
          termiteCompany: models.company(),
          retrofitCompany: models.company(),
          certificateCompliance: models.company(),
          vendors: [models.vendor()]
        }
      });
      
      // ==================== STATE MANAGEMENT ====================
      let state = getInitialState();
      let loadedFileName = null;
      
      // ==================== UTILITIES ====================
      const $ = (sel, root = document) => root.querySelector(sel);
      
      const el = (tag, attrs = {}, children = []) => {
        const elem = document.createElement(tag);
        
        Object.entries(attrs).forEach(([key, val]) => {
          if (val == null) return;
          
          if (key === 'class') elem.className = val;
          else if (key === 'style') elem.style.cssText = val;
          else if (key.startsWith('on') && typeof val === 'function') {
            elem.addEventListener(key.slice(2), val);
          }
          else if ((key === 'value') && (tag === 'textarea' || tag === 'select')) {
            elem.value = val;
          }
          else elem.setAttribute(key, val);
        });
        
        const childArray = Array.isArray(children) ? children : [children];
        childArray.forEach(child => {
          if (child == null) return;
          elem.appendChild(
            typeof child === 'string' 
              ? document.createTextNode(child)
              : child
          );
        });
        
        return elem;
      };
      
      const toMoney = n => (Number(n) || 0).toFixed(2);
      const toNum = v => { 
        const x = parseFloat(v); 
        return Number.isFinite(x) ? Number(x.toFixed(2)) : 0; 
      };
      
      const todayISO = () => {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };
      
      const addDaysISO = (iso, days = 0) => {
        if (!iso) return '';
        const parts = iso.split('-');
        if (parts.length !== 3) return '';
        const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        if (isNaN(d.getTime())) return '';
        d.setDate(d.getDate() + (parseInt(days, 10) || 0));
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };
      
      const formatDateMMDDYYYY = (iso) => {
        if (!iso) return '';
        const parts = iso.split('-');
        if (parts.length !== 3) return '';
        const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        if (isNaN(d.getTime())) return '';
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const year = d.getFullYear();
        return `${month}/${day}/${year}`;
      };
      
      const parseMMDDYYYY = (dateStr) => {
        if (!dateStr) return '';
        const cleaned = dateStr.replace(/[^\d\/]/g, '');
        const parts = cleaned.split('/');
        if (parts.length !== 3) return '';
        const month = parts[0].padStart(2, '0');
        const day = parts[1].padStart(2, '0');
        let year = parts[2];
        if (year.length === 2) {
          year = (parseInt(year) < 50 ? '20' : '19') + year;
        }
        const d = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
        if (isNaN(d.getTime())) return '';
        return `${year}-${month}-${day}`;
      };
      
      // ==================== FORM HELPERS ====================
      const Field = (label, value, onInput, attrs = {}) => 
        el('label', {}, [
          el('span', {}, [label]),
          el('input', {
            value: value ?? '',
            oninput: e => onInput(e.target.value),
            ...attrs
          })
        ]);
      
      const DateField = (label, isoValue, onChange) => 
        el('label', {}, [
          el('span', {}, [label]),
          el('input', {
            value: formatDateMMDDYYYY(isoValue),
            placeholder: 'mm/dd/yyyy',
            oninput: e => {
              const iso = parseMMDDYYYY(e.target.value);
              if (iso) {
                onChange(iso);
                render();
              }
            }
          })
        ]);
      
      const Select = (label, value, onChange, options) => {
        const select = el('select', {
          value,
          oninput: e => onChange(e.target.value)
        }, options.map(([val, text]) => 
          el('option', { value: val }, [text])
        ));
        
        const labelEl = el('label', {}, [
          el('span', {}, [label]),
          select
        ]);
        
        select.value = value;
        return labelEl;
      };
      
      const TextArea = (value, onChange) => 
        el('textarea', {
          value: value || '',
          oninput: e => onChange(e.target.value),
          style: 'min-height:100px;width:100%;margin-top:6px;border:1px solid #dcdfe5;border-radius:10px;padding:8px 10px;font-size:14px;outline:none;font-family:inherit'
        });
      
      const InfoBox = (label, content, isLast = false) =>
        el('div', { style: isLast ? styles.infoBoxLast : styles.infoBox }, [
          label ? el('div', { style: styles.infoLabel }, [label]) : null,
          ...content
        ].filter(Boolean));
      
      const SectionHeader = (title, onAdd = null) =>
        el('div', { 
          style: 'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px' 
        }, [
          el('h2', {}, [title]),
          onAdd ? el('button', { 
            class: 'btn primary', 
            onclick: onAdd 
          }, ['+ Add']) : null
        ].filter(Boolean));
      
      // ==================== RENDER ENGINE ====================
      function render() {
        const root = $('#escrowSetupApp');
        root.innerHTML = '';
        
        // Add header actions
        const headerActions = el('div', { 
          class: 'section',
          style: 'background: #f8f9fb; margin-bottom: 16px;'
        }, [
          el('h2', {}, ['📄 Escrow Setup System v7.0']),
          el('div', { class: 'btn-group' }, [
            el('button', { 
              class: 'btn primary', 
              onclick: 'escrowSetupApp.saveEscrow()' 
            }, ['💾 Save Escrow']),
            el('input', { 
              type: 'file', 
              id: 'escrowFileInput', 
              accept: '.json', 
              style: 'display:none', 
              onchange: 'escrowSetupApp.loadEscrow(event)' 
            }),
            el('button', { 
              class: 'btn', 
              onclick: 'document.getElementById("escrowFileInput").click()' 
            }, ['📂 Load Escrow']),
            el('input', { 
              type: 'file', 
              id: 'systemDefaultsInput', 
              accept: '.json', 
              style: 'display:none', 
              onchange: 'escrowSetupApp.loadSystemDefaults(event)' 
            }),
            el('button', { 
              class: 'btn', 
              onclick: 'document.getElementById("systemDefaultsInput").click()',
              title: 'Load System Defaults JSON'
            }, ['⚙️ System']),
            el('input', { 
              type: 'file', 
              id: 'clientDefaultsInput', 
              accept: '.json', 
              style: 'display:none', 
              onchange: 'escrowSetupApp.loadClientDefaults(event)' 
            }),
            el('button', { 
              class: 'btn', 
              onclick: 'document.getElementById("clientDefaultsInput").click()',
              title: 'Load Client Defaults JSON'
            }, ['👤 Client']),
            el('button', { 
              class: 'btn danger', 
              onclick: 'escrowSetupApp.clearAll()' 
            }, ['🗑️ Clear All'])
          ])
        ]);
        
        root.appendChild(headerActions);
        
        // Add main content sections
        const sections = [
          createEscrowSection(),
          createPropertySection(),
          createParticipantsSection('sellers', '🏠 Sellers'),
          createParticipantsSection('buyers', '👤 Buyers'),
          createParticipantsSection('sellerAgents', '🤝 Seller Agents'),
          createParticipantsSection('buyerAgents', '📋 Buyer Agents'),
          createParticipantsSection('transactionCoordinators', '📊 Transaction Coordinators'),
          createLendersSection('lenders', '🏦 Lenders'),
          createLendersSection('loanBrokers', '💼 Loan Brokers'),
          createTitleSection(),
          createHOASection(),
          createInsuranceSection(),
          createPayoffsSection(),
          createCompanySection('nhdCompany', 'NHD Company', '📊'),
          createCompanySection('homeWarranty', 'Home Warranty', '🔒'),
          createCompanySection('termiteCompany', 'Termite Company', '🐛'),
          createCompanySection('retrofitCompany', 'Retrofit Company', '🏗️'),
          createCompanySection('certificateCompliance', 'Certificate of Compliance', '📜'),
          createVendorsSection()
        ];
        
        sections.forEach(section => root.appendChild(section));
      }
      
      // ==================== SECTION CREATORS ====================
      function createEscrowSection() {
        const s = state.escrowSetup.escrow;
        s.closeDate = addDaysISO(s.acceptanceDate, s.daysToClose);
        const estCloseFormatted = formatDateMMDDYYYY(s.closeDate);
        
        return el('div', { class: 'section' }, [
          el('h2', {}, ['📄 Escrow Information']),
          InfoBox('Escrow Details', [
            el('div', { style: styles.grid }, [
              Field('Company', s.company, v => s.company = v),
              Field('Branch', s.branch, v => s.branch = v),
              Field('License', s.license, v => s.license = v)
            ]),
            el('div', { style: `${styles.grid};margin-top:12px` }, [
              Field('Escrow Number', s.number, v => s.number = v, { type: 'number', step: '1' }),
              Field('Escrow Initials', s.initials, v => s.initials = v.toUpperCase().slice(0, 2)),
              Field('Escrow Officer', s.officer, v => s.officer = v)
            ]),
            el('div', { style: `${styles.grid};margin-top:12px` }, [
              Field('Address', s.address, v => s.address = v),
              Field('City St, Zip', s.citystzip, v => s.citystzip = v),
              Field('Website', s.web, v => s.web = v)
            ])
          ]),
          InfoBox('Contact Information', [
            el('div', { style: styles.grid }, [
              Field('Email', s.email, v => s.email = v),
              Field('Phone', s.phone, v => s.phone = v),
              Field('Fax', s.fax, v => s.fax = v)
            ])
          ]),
          InfoBox('Status & Timeline', [
            el('div', { style: styles.grid }, [
              Select('Escrow Status', s.status, v => { s.status = v; render(); }, 
                [['O', 'Open'], ['C', 'Closed']]),
              Select('Escrow Type', s.type, v => { s.type = v; render(); }, 
                [['S', 'Sale'], ['R', 'Refinance'], ['O', 'Other']]),
              Field('Days to Close', s.daysToClose, () => {}, {
                type: 'number',
                step: '1',
                onchange: e => { s.daysToClose = parseInt(e.target.value || 0, 10) || 0; render(); }
              })
            ]),
            el('div', { style: `${styles.grid};margin-top:12px` }, [
              DateField('Acceptance Date', s.acceptanceDate, v => s.acceptanceDate = v),

      // ==================== PUBLIC API ====================
      return {
        saveEscrow() {
          if (state.escrowSetup.escrow.acceptanceDate && state.escrowSetup.escrow.daysToClose !== undefined) {
            state.escrowSetup.escrow.closeDate = addDaysISO(
              state.escrowSetup.escrow.acceptanceDate, 
              state.escrowSetup.escrow.daysToClose
            );
          }
          
          const dataStr = JSON.stringify(state, null, 2);
          const blob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const prefix = getClientDefault('filePrefix', 'escrow');
          const fileName = loadedFileName || 
            `${prefix}-${state.escrowSetup.escrow.number || 'data'}-${state.escrowSetup.escrow.initials || 'XX'}.json`;
          
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          
          alert('Escrow data saved successfully!');
        },
        
        loadEscrow(event) {
          const file = event.target.files[0];
          if (!file) return;
          
          loadedFileName = file.name;
          
          const reader = new FileReader();
          reader.onload = e => {
            try {
              const loadedData = JSON.parse(e.target.result);
              if (loadedData && loadedData.escrowSetup) {
                state = loadedData;
                render();
                alert('Escrow data loaded successfully!');
              } else {
                alert('Invalid escrow file format');
              }
            } catch (error) {
              alert(`Error loading file: ${error.message}`);
            }
          };
          reader.readAsText(file);
        },
        
        loadSystemDefaults(event) {
          const file = event.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = e => {
            try {
              const defaults = JSON.parse(e.target.result);
              if (defaults && defaults.dropdowns) {
                loadedSystemDefaults = defaults;
                render();
                alert('System defaults loaded successfully!');
              } else {
                alert('Invalid system defaults file format');
              }
            } catch (error) {
              alert(`Error loading system defaults: ${error.message}`);
            }
          };
          reader.readAsText(file);
          event.target.value = '';
        },
        
        loadClientDefaults(event) {
          const file = event.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = e => {
            try {
              const defaults = JSON.parse(e.target.result);
              if (defaults) {
                loadedClientDefaults = defaults;
                console.log('Client defaults loaded:', Object.keys(defaults));
                
                const s = state.escrowSetup.escrow;
                if (defaults.escrow) {
                  if (!s.company) s.company = defaults.escrow.company || '';
                  if (!s.branch) s.branch = defaults.escrow.branch || '';
                  if (!s.license) s.license = defaults.escrow.license || '';
                  if (!s.initials) s.initials = defaults.escrow.initials || '';
                  if (!s.officer) s.officer = defaults.escrow.officer || '';
                  if (!s.address) s.address = defaults.escrow.address || '';
                  if (!s.citystzip) s.citystzip = defaults.escrow.citystzip || '';
                  if (!s.email) s.email = defaults.escrow.email || '';
                  if (!s.phone) s.phone = defaults.escrow.phone || '';
                  if (!s.fax) s.fax = defaults.escrow.fax || '';
                  if (!s.web) s.web = defaults.escrow.web || '';
                }
                
                render();
                alert('Client defaults loaded successfully!\n\nAll configuration data has been preserved and is available for use.');
              } else {
                alert('Invalid client defaults file format');
              }
            } catch (error) {
              alert(`Error loading client defaults: ${error.message}`);
            }
          };
          reader.readAsText(file);
          event.target.value = '';
        },
        
        clearAll() {
          if (confirm('Are you sure you want to clear all data? This cannot be undone.')) {
            state = getInitialState();
            loadedFileName = null;
            render();
            alert('All data cleared successfully!');
          }
        },
        
        async init() {
          await loadDefaultsFromFiles();
          render();
        },
        
        render: render
      };
    })();
    
    // Initialize the escrow setup app

    });
