<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lender Funding v1.3</title>
  <style>
    /* Minimal styles for iframe content */
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      background: #f7f7fb;
      color: #111;
    }
    
    .section {
      background: #fff;
      border: 1px solid #dcdfe5;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }
    
    h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      border: 1px solid #dcdfe5;
      background: white;
      color: #111;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.15s;
      text-decoration: none;
    }
    
    .btn:hover {
      background: #f5f5ff;
    }
    
    .btn.primary {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }
    
    .btn.primary:hover {
      background: #4338ca;
    }
    
    .btn.danger {
      color: #b91c1c;
      background: #fff3f3;
      border-color: #f3d1d1;
    }
    
    .btn.danger:hover {
      background: #fee2e2;
    }
    
    .btn.edit {
      background: #f0f9ff;
      color: #0369a1;
      border-color: #bae6fd;
    }
    
    .btn.edit:hover {
      background: #e0f2fe;
    }
    
    .btn.calc {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #bbf7d0;
    }
    
    .btn.calc:hover {
      background: #dcfce7;
    }
    
    input, select {
      width: 100%;
      border: 1px solid #dcdfe5;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    
    input:focus, select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }
    
    input[readonly] {
      background-color: #f3f4f6;
      color: #6b7280;
      cursor: not-allowed;
    }
    
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    input[type=number] {
      -moz-appearance: textfield;
    }
    
    input.negative {
      color: #dc2626;
    }
    
    input.positive {
      color: #16a34a;
    }
    
    .row {
      display: grid;
      grid-template-columns: .8fr 1.2fr .6fr .6fr 100px;
      gap: 8px;
      align-items: center;
    }
    
    .row.header {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
    }
    
    .row + .row {
      margin-top: 8px;
    }
    
    .totals {
      display: grid;
      grid-template-columns: .8fr 1.2fr .6fr .6fr 100px;
      gap: 8px;
      align-items: center;
      padding-top: 8px;
      margin-top: 12px;
      border-top: 1px solid #dcdfe5;
      font-weight: 700;
    }
    
    .totals .label {
      text-align: right;
      color: #6b7280;
      font-weight: 700;
    }
    
    .totals .amount {
      text-align: center;
      font-weight: 700;
    }
    
    .muted {
      color: #6b7280;
    }
    
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: white;
      border-radius: 14px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal h3 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    .modal .btn-group {
      margin-top: 16px;
      justify-content: flex-end;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="lenderFundingApp">
    <div class="section">
      <h2>🏦 Lender Funding v1.3</h2>
      <div class="btn-group">
        <button class="btn primary" onclick="lenderFundingApp.save()">💾 Save Funding</button>
        <input type="file" id="fundingFileInput" accept=".json" style="display:none" onchange="lenderFundingApp.load(event)">
        <button class="btn" onclick="document.getElementById('fundingFileInput').click()">📂 Load Funding</button>
        <button class="btn danger" onclick="lenderFundingApp.clear()">🗑️ Clear All</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== LENDER FUNDING MODULE ====================
    window.lenderFundingApp = (function() {
      'use strict';
      
      // ==================== CONSTANTS ====================
      const DECIMALS = 2;
      const MONEY_STEP = 0.01;
      const toMoney = n => (Number(n) || 0).toFixed(DECIMALS);
      const toNum = v => { 
        const x = parseFloat(v); 
        return Number.isFinite(x) ? Number(x.toFixed(DECIMALS)) : 0; 
      };
      
      // ==================== STATE ====================
      let state = {
        lenders: []
      };
      
      let originalDoc = null;
      let originalFilename = null;
      let currentLenderIndex = 0;
      let idxCounter = 0;
      let focusAfterRender = null;
      
      // ==================== UTILITIES ====================
      const $ = (sel, root = document) => root.querySelector(sel);
      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
      
      const el = (tag, attrs = {}, children = []) => {
        const elem = document.createElement(tag);
        
        Object.entries(attrs).forEach(([key, val]) => {
          if (val == null) return;
          
          if (key === 'class') elem.className = val;
          else if (key === 'style') elem.style.cssText = val;
          else if (key.startsWith('on') && typeof val === 'function') {
            elem.addEventListener(key.slice(2), val);
          }
          else if ((key === 'value') && (tag === 'textarea' || tag === 'select')) {
            elem.value = val;
          }
          else elem.setAttribute(key, val);
        });
        
        const childArray = Array.isArray(children) ? children : [children];
        childArray.forEach(child => {
          if (child == null) return;
          elem.appendChild(
            typeof child === 'string' 
              ? document.createTextNode(child)
              : child
          );
        });
        
        return elem;
      };
      
      // ==================== HELPER FUNCTIONS ====================
      function getLenderName(lender) {
        return lender.name || 'Unnamed Lender';
      }
      
      function getLenderLoanNumber(lender) {
        return lender.loanNumber || 'No Loan Number';
      }
      
      function getLenderAddress(lender) {
        return lender.address || 'No Address';
      }
      
      function getLenderContact(lender) {
        return lender.contact || 'No Contact';
      }
      
      function getLenderProcessor(lender) {
        return lender.processor || 'No Processor';
      }
      
      // ==================== MODAL FUNCTIONS ====================
      function showModal(title, content, onSave = null) {
        const overlay = el('div', { class: 'modal-overlay' }, [
          el('div', { class: 'modal' }, [
            el('h3', {}, [title]),
            content,
            el('div', { class: 'btn-group' }, [
              el('button', { 
                class: 'btn', 
                onclick: () => document.body.removeChild(overlay) 
              }, ['Cancel']),
              onSave ? el('button', { 
                class: 'btn primary', 
                onclick: () => { onSave(); document.body.removeChild(overlay); } 
              }, ['Save']) : null
            ].filter(Boolean))
          ])
        ]);
        
        document.body.appendChild(overlay);
      }
      
      function addLender() {
        const newLender = {
          id: ++idxCounter,
          name: '',
          loanNumber: '',
          address: '',
          contact: '',
          processor: '',
          fees: []
        };
        
        state.lenders.push(newLender);
        currentLenderIndex = state.lenders.length - 1;
        render();
      }
      
      function editCurrentLender() {
        if (state.lenders.length === 0) {
          alert('No lenders to edit. Please add a lender first.');
          return;
        }
        
        const lender = state.lenders[currentLenderIndex];
        if (!lender) return;
        
        const content = el('div', {}, [
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Lender Name']),
            el('input', { 
              type: 'text', 
              value: lender.name || '',
              oninput: e => lender.name = e.target.value
            })
          ]),
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Loan Number']),
            el('input', { 
              type: 'text', 
              value: lender.loanNumber || '',
              oninput: e => lender.loanNumber = e.target.value
            })
          ]),
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Address']),
            el('input', { 
              type: 'text', 
              value: lender.address || '',
              oninput: e => lender.address = e.target.value
            })
          ]),
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Contact']),
            el('input', { 
              type: 'text', 
              value: lender.contact || '',
              oninput: e => lender.contact = e.target.value
            })
          ]),
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Processor']),
            el('input', { 
              type: 'text', 
              value: lender.processor || '',
              oninput: e => lender.processor = e.target.value
            })
          ])
        ]);
        
        showModal('Edit Lender Information', content, () => render());
      }
      
      function removeLender() {
        if (state.lenders.length === 0) {
          alert('No lenders to remove.');
          return;
        }
        
        if (confirm('Are you sure you want to remove this lender? This cannot be undone.')) {
          state.lenders.splice(currentLenderIndex, 1);
          if (currentLenderIndex >= state.lenders.length) {
            currentLenderIndex = Math.max(0, state.lenders.length - 1);
          }
          render();
        }
      }
      
      // ==================== DATA INITIALIZATION ====================
      function initializeData() {
        if (state.lenders.length === 0) {
          addLender();
        }
      }
      
      // ==================== INPUT HANDLERS ====================
      function moneyInput(e) {
        const input = e.target;
        const value = input.value;
        
        // Remove any non-numeric characters except decimal point
        const cleaned = value.replace(/[^\d.-]/g, '');
        
        // Ensure only one decimal point
        const parts = cleaned.split('.');
        if (parts.length > 2) {
          input.value = parts[0] + '.' + parts.slice(1).join('');
        } else {
          input.value = cleaned;
        }
        
        // Update the state
        const lender = state.lenders[currentLenderIndex];
        if (lender && lender.fees) {
          const fee = lender.fees.find(f => f.id === parseInt(input.dataset.feeId));
          if (fee) {
            fee.amount = toNum(input.value);
          }
        }
        
        // Update totals
        updateTotals();
      }
      
      // ==================== TABBING SYSTEM ====================
      function setupTabbing() {
        const inputs = $$('input[type="text"], input[type="number"], select');
        inputs.forEach((input, index) => {
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
              e.preventDefault();
              const nextIndex = e.shiftKey ? index - 1 : index + 1;
              if (nextIndex >= 0 && nextIndex < inputs.length) {
                inputs[nextIndex].focus();
              }
            }
          });
        });
      }
      
      // ==================== RENDER FUNCTIONS ====================
      function render() {
        const root = $('#lenderFundingApp');
        root.innerHTML = '';
        
        // Add header actions
        const headerActions = el('div', { 
          class: 'section',
          style: 'background: #f8f9fb; margin-bottom: 16px;'
        }, [
          el('h2', {}, ['🏦 Lender Funding v1.3']),
          el('div', { class: 'btn-group' }, [
            el('button', { 
              class: 'btn primary', 
              onclick: 'lenderFundingApp.save()' 
            }, ['💾 Save Funding']),
            el('input', { 
              type: 'file', 
              id: 'fundingFileInput', 
              accept: '.json', 
              style: 'display:none', 
              onchange: 'lenderFundingApp.load(event)' 
            }),
            el('button', { 
              class: 'btn', 
              onclick: 'document.getElementById("fundingFileInput").click()' 
            }, ['📂 Load Funding']),
            el('button', { 
              class: 'btn danger', 
              onclick: 'lenderFundingApp.clear()' 
            }, ['🗑️ Clear All'])
          ])
        ]);
        
        root.appendChild(headerActions);
        
        if (state.lenders.length === 0) {
          const emptyState = el('div', { class: 'section' }, [
            el('div', { 
              style: 'text-align: center; color: #6b7280; padding: 40px' 
            }, [
              el('h3', { style: 'margin: 0 0 16px 0' }, ['No Lenders Added']),
              el('p', { style: 'margin: 0 0 16px 0' }, ['Click "Add Lender" to get started.']),
              el('button', { 
                class: 'btn primary', 
                onclick: 'lenderFundingApp.addLender()' 
              }, ['+ Add Lender'])
            ])
          ]);
          root.appendChild(emptyState);
          return;
        }
        
        // Lender selection
        const lenderSelection = el('div', { class: 'section' }, [
          el('h2', {}, ['🏦 Select Lender']),
          el('div', { style: 'display: flex; gap: 8px; align-items: center; flex-wrap: wrap' }, [
            el('select', {
              value: currentLenderIndex,
              onchange: e => {
                currentLenderIndex = parseInt(e.target.value);
                render();
              }
            }, state.lenders.map((lender, index) => 
              el('option', { value: index }, [
                `${index + 1}. ${getLenderName(lender)} - ${getLenderLoanNumber(lender)}`
              ])
            )),
            el('button', { 
              class: 'btn edit', 
              onclick: 'lenderFundingApp.editCurrentLender()' 
            }, ['✏️ Edit']),
            el('button', { 
              class: 'btn primary', 
              onclick: 'lenderFundingApp.addLender()' 
            }, ['+ Add Lender']),
            el('button', { 
              class: 'btn danger', 
              onclick: 'lenderFundingApp.removeLender()' 
            }, ['🗑️ Remove'])
          ])
        ]);
        
        root.appendChild(lenderSelection);
        
        // Current lender info
        const currentLender = state.lenders[currentLenderIndex];
        if (currentLender) {
          const lenderInfo = el('div', { class: 'section' }, [
            el('h2', {}, [`📋 ${getLenderName(currentLender)}`]),
            el('div', { style: 'display: grid; grid-template-columns: 1fr 1fr; gap: 16px' }, [
              el('div', {}, [
                el('div', { style: 'margin-bottom: 8px' }, [
                  el('strong', {}, ['Loan Number: ']),
                  el('span', {}, [getLenderLoanNumber(currentLender)])
                ]),
                el('div', { style: 'margin-bottom: 8px' }, [
                  el('strong', {}, ['Address: ']),
                  el('span', {}, [getLenderAddress(currentLender)])
                ])
              ]),
              el('div', {}, [
                el('div', { style: 'margin-bottom: 8px' }, [
                  el('strong', {}, ['Contact: ']),
                  el('span', {}, [getLenderContact(currentLender)])
                ]),
                el('div', { style: 'margin-bottom: 8px' }, [
                  el('strong', {}, ['Processor: ']),
                  el('span', {}, [getLenderProcessor(currentLender)])
                ])
              ])
            ])
          ]);
          
          root.appendChild(lenderInfo);
          
          // Fees section
          const feesSection = el('div', { class: 'section' }, [
            el('h2', {}, ['💰 Lender Fees']),
            el('div', { style: 'margin-bottom: 16px' }, [
              el('button', { 
                class: 'btn primary', 
                onclick: () => {
                  if (!currentLender.fees) currentLender.fees = [];
                  currentLender.fees.push({
                    id: ++idxCounter,
                    description: '',
                    amount: 0
                  });
                  render();
                }
              }, ['+ Add Fee'])
            ])
          ]);
          
          if (currentLender.fees && currentLender.fees.length > 0) {
            // Header row
            const headerRow = el('div', { class: 'row header' }, [
              el('div', {}, ['Description']),
              el('div', {}, ['Amount']),
              el('div', {}, ['Actions'])
            ]);
            
            feesSection.appendChild(headerRow);
            
            // Fee rows
            currentLender.fees.forEach(fee => {
              const row = el('div', { class: 'row' }, [
                el('div', {}, [
                  el('input', {
                    type: 'text',
                    value: fee.description || '',
                    placeholder: 'Enter fee description',
                    oninput: e => fee.description = e.target.value
                  })
                ]),
                el('div', {}, [
                  el('input', {
                    type: 'number',
                    step: MONEY_STEP,
                    value: fee.amount || 0,
                    'data-fee-id': fee.id,
                    oninput: moneyInput,
                    class: fee.amount < 0 ? 'negative' : fee.amount > 0 ? 'positive' : ''
                  })
                ]),
                el('div', {}, [
                  el('button', {
                    class: 'btn danger',
                    style: 'padding: 4px 8px; font-size: 12px',
                    onclick: () => {
                      const index = currentLender.fees.findIndex(f => f.id === fee.id);
                      if (index > -1) {
                        currentLender.fees.splice(index, 1);
                        render();
                      }
                    }
                  }, ['🗑️'])
                ])
              ]);
              
              feesSection.appendChild(row);
            });
            
            // Totals row
            const total = currentLender.fees.reduce((sum, fee) => sum + (fee.amount || 0), 0);
            const totalsRow = el('div', { class: 'totals' }, [
              el('div', { class: 'label' }, ['Total:']),
              el('div', {}, ['']),
              el('div', { 
                class: 'amount',
                style: total < 0 ? 'color: #dc2626' : total > 0 ? 'color: #16a34a' : ''
              }, [`$${toMoney(total)}`]),
              el('div', {}, ['']),
              el('div', {}, [''])
            ]);
            
            feesSection.appendChild(totalsRow);
          } else {
            feesSection.appendChild(el('div', { 
              style: 'text-align: center; color: #6b7280; padding: 20px' 
            }, ['No fees added yet. Click "Add Fee" to begin.']));
          }
          
          root.appendChild(feesSection);
        }
        
        // Setup tabbing
        setTimeout(setupTabbing, 100);
        
        // Focus after render
        if (focusAfterRender) {
          const element = $(focusAfterRender);
          if (element) {
            element.focus();
            focusAfterRender = null;
          }
        }
      }
      
      function updateTotals() {
        // Update totals for current lender
        const currentLender = state.lenders[currentLenderIndex];
        if (currentLender && currentLender.fees) {
          const total = currentLender.fees.reduce((sum, fee) => sum + (fee.amount || 0), 0);
          
          // Update total display
          const totalEl = $('.totals .amount');
          if (totalEl) {
            totalEl.textContent = `$${toMoney(total)}`;
            totalEl.style.color = total < 0 ? '#dc2626' : total > 0 ? '#16a34a' : '';
          }
        }
      }
      
      // ==================== EXPORT FUNCTIONS ====================
      function prepareExport() {
        return {
          version: '1.3',
          timestamp: new Date().toISOString(),
          lenders: state.lenders.map(lender => ({
            ...lender,
            fees: (lender.fees || []).map(fee => ({
              ...fee,
              amount: toNum(fee.amount)
            }))
          }))
        };
      }
      
      // ==================== PUBLIC API ====================
      return {
        save() {
          const data = prepareExport();
          const dataStr = JSON.stringify(data, null, 2);
          const blob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const fileName = originalFilename || `lender-funding-${new Date().toISOString().split('T')[0]}.json`;
          
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          
          alert('Lender funding data saved successfully!');
        },
        
        load(event) {
          const file = event.target.files[0];
          if (!file) return;
          
          originalFilename = file.name;
          
          const reader = new FileReader();
          reader.onload = e => {
            try {
              const loadedData = JSON.parse(e.target.result);
              if (loadedData && Array.isArray(loadedData.lenders)) {
                state.lenders = loadedData.lenders.map(lender => ({
                  ...lender,
                  fees: (lender.fees || []).map(fee => ({
                    ...fee,
                    amount: toNum(fee.amount)
                  }))
                }));
                currentLenderIndex = 0;
                render();
                alert('Lender funding data loaded successfully!');
              } else {
                alert('Invalid lender funding file format');
              }
            } catch (error) {
              alert(`Error loading file: ${error.message}`);
            }
          };
          reader.readAsText(file);
        },
        
        addLender() {
          addLender();
        },
        
        editCurrentLender() {
          editCurrentLender();
        },
        
        removeLender() {
          removeLender();
        },
        
        clear() {
          if (confirm('Are you sure you want to clear all lender funding data? This cannot be undone.')) {
            state.lenders = [];
            currentLenderIndex = 0;
            originalFilename = null;
            render();
            alert('All lender funding data cleared successfully!');
          }
        },
        
        init() {
          initializeData();
          render();
        },
        
        render: render
      };
    })();
    
    // Initialize the lender funding app
    document.addEventListener('DOMContentLoaded', function() {
      window.lenderFundingApp.init();
    });
  </script>
</body>
</html>
