# SnappyMail Apache Configuration
# Add this to your VirtualHost configuration

<IfModule alias_module>
    Alias /mail /var/www/html/public/snappymail
</IfModule>

<Directory /var/www/html/public/snappymail>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # PHP settings for SnappyMail
    <IfModule mod_php7.c>
        php_value upload_max_filesize 25M
        php_value post_max_size 25M
        php_value max_execution_time 300
        php_value max_input_time 300
        php_value memory_limit 256M
    </IfModule>

    # Security headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
    </IfModule>
</Directory>

# Optional: Redirect /webmail to /mail
# RedirectMatch 301 ^/webmail$ /mail
