<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUNDING CREDITS v1.8.2</title>
  <style>
    /* Minimal styles for iframe content */
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      background: #f7f7fb;
      color: #111;
    }
    
    .section {
      background: #fff;
      border: 1px solid #dcdfe5;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }
    
    h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      border: 1px solid #dcdfe5;
      background: white;
      color: #111;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.15s;
      text-decoration: none;
    }
    
    .btn:hover {
      background: #f5f5ff;
    }
    
    .btn.primary {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }
    
    .btn.primary:hover {
      background: #4338ca;
    }
    
    .btn.danger {
      color: #b91c1c;
      background: #fff3f3;
      border-color: #f3d1d1;
    }
    
    .btn.danger:hover {
      background: #fee2e2;
    }
    
    .btn.edit {
      background: #f0f9ff;
      color: #0369a1;
      border-color: #bae6fd;
    }
    
    .btn.edit:hover {
      background: #e0f2fe;
    }
    
    .btn.calc {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #bbf7d0;
    }
    
    .btn.calc:hover {
      background: #dcfce7;
    }
    
    input, select {
      width: 100%;
      border: 1px solid #dcdfe5;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    
    input:focus, select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }
    
    input[readonly] {
      background-color: #f3f4f6;
      color: #6b7280;
      cursor: not-allowed;
    }
    
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    input[type=number] {
      -moz-appearance: textfield;
    }
    
    input.negative {
      color: #dc2626;
    }
    
    input.positive {
      color: #16a34a;
    }
    
    .row {
      display: grid;
      grid-template-columns: .8fr 1.2fr .6fr .6fr 100px;
      gap: 8px;
      align-items: center;
    }
    
    .row.header {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
    }
    
    .row + .row {
      margin-top: 8px;
    }
    
    .totals {
      display: grid;
      grid-template-columns: .8fr 1.2fr .6fr .6fr 100px;
      gap: 8px;
      align-items: center;
      padding-top: 8px;
      margin-top: 12px;
      border-top: 1px solid #dcdfe5;
      font-weight: 700;
    }
    
    .totals .label {
      text-align: right;
      color: #6b7280;
      font-weight: 700;
    }
    
    .totals .amount {
      text-align: center;
      font-weight: 700;
    }
    
    .muted {
      color: #6b7280;
    }
    
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: white;
      border-radius: 14px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal h3 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    .modal .btn-group {
      margin-top: 16px;
      justify-content: flex-end;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="fundingCreditsApp">
    <div class="section">
      <h2>💰 Funding Credits v1.8.2</h2>
      <div class="btn-group">
        <button class="btn primary" onclick="fundingCreditsApp.saveData()">💾 Save Credits</button>
        <input type="file" id="creditsFileInput" accept=".json" style="display:none" onchange="fundingCreditsApp.loadData(event)">
        <button class="btn" onclick="document.getElementById('creditsFileInput').click()">📂 Load Credits</button>
        <button class="btn danger" onclick="fundingCreditsApp.clearCredits()">🗑️ Clear All</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== FUNDING CREDITS MODULE ====================
    window.fundingCreditsApp = (function() {
      'use strict';
      
      // ==================== CONSTANTS ====================
      const DECIMALS = 2;
      const MONEY_STEP = 0.01;
      const toMoney = n => (Number(n) || 0).toFixed(DECIMALS);
      const toNum = v => { 
        const x = parseFloat(v); 
        return Number.isFinite(x) ? Number(x.toFixed(DECIMALS)) : 0; 
      };
      
      // ==================== STATE ====================
      let state = {
        credits: []
      };
      
      let originalDoc = null;
      let originalFilename = null;
      let idxCounter = 0;
      let focusAfterRender = null;
      
      // ==================== SECTIONS ====================
      const SECTIONS = [
        { key: 'lender', label: 'Lender Credits', icon: '🏦' },
        { key: 'seller', label: 'Seller Credits', icon: '🏠' },
        { key: 'buyer', label: 'Buyer Credits', icon: '👤' },
        { key: 'other', label: 'Other Credits', icon: '📋' }
      ];
      
      // ==================== PRORATION DEFAULTS ====================
      const PRORATION_DEFAULTS = {
        lender: { days: 30, rate: 0.06 },
        seller: { days: 30, rate: 0.06 },
        buyer: { days: 30, rate: 0.06 },
        other: { days: 30, rate: 0.06 }
      };
      
      // ==================== UTILITIES ====================
      const $ = (sel, root = document) => root.querySelector(sel);
      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
      
      const el = (tag, attrs = {}, children = []) => {
        const elem = document.createElement(tag);
        
        Object.entries(attrs).forEach(([key, val]) => {
          if (val == null) return;
          
          if (key === 'class') elem.className = val;
          else if (key === 'style') elem.style.cssText = val;
          else if (key.startsWith('on') && typeof val === 'function') {
            elem.addEventListener(key.slice(2), val);
          }
          else if ((key === 'value') && (tag === 'textarea' || tag === 'select')) {
            elem.value = val;
          }
          else elem.setAttribute(key, val);
        });
        
        const childArray = Array.isArray(children) ? children : [children];
        childArray.forEach(child => {
          if (child == null) return;
          elem.appendChild(
            typeof child === 'string' 
              ? document.createTextNode(child)
              : child
          );
        });
        
        return elem;
      };
      
      const getParty = (section) => {
        switch (section) {
          case 'lender': return 'Lender';
          case 'seller': return 'Seller';
          case 'buyer': return 'Buyer';
          case 'other': return 'Other';
          default: return 'Unknown';
        }
      };
      
      // ==================== MODAL FUNCTIONS ====================
      function showModal(title, content, onSave = null) {
        const overlay = el('div', { class: 'modal-overlay' }, [
          el('div', { class: 'modal' }, [
            el('h3', {}, [title]),
            content,
            el('div', { class: 'btn-group' }, [
              el('button', { 
                class: 'btn', 
                onclick: () => document.body.removeChild(overlay) 
              }, ['Cancel']),
              onSave ? el('button', { 
                class: 'btn primary', 
                onclick: () => { onSave(); document.body.removeChild(overlay); } 
              }, ['Save']) : null
            ].filter(Boolean))
          ])
        ]);
        
      document.body.appendChild(overlay);
      }
      
      function showProrationModal(credit, onSave) {
        const defaults = PRORATION_DEFAULTS[credit.section] || PRORATION_DEFAULTS.other;
        
        const content = el('div', {}, [
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Days in Period']),
            el('input', { 
              type: 'number', 
              value: credit.prorationDays || defaults.days,
              oninput: e => credit.prorationDays = parseInt(e.target.value) || 0
            })
          ]),
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Interest Rate (%)']),
            el('input', { 
              type: 'number', 
              step: '0.01',
              value: (credit.prorationRate || defaults.rate) * 100,
              oninput: e => credit.prorationRate = (parseFloat(e.target.value) || 0) / 100
            })
          ]),
          el('div', { style: 'background: #f8f9fb; padding: 12px; border-radius: 8px' }, [
            el('div', { style: 'font-size: 12px; color: #6b7280; margin-bottom: 4px' }, ['Calculation:']),
            el('div', { style: 'font-weight: 600' }, [
              `$${toMoney(credit.amount)} × ${credit.prorationDays || defaults.days} days × ${((credit.prorationRate || defaults.rate) * 100).toFixed(2)}% ÷ 365 = $${toMoney((credit.amount || 0) * (credit.prorationDays || defaults.days) * (credit.prorationRate || defaults.rate) / 365)}`
            ])
          ])
        ]);
        
        showModal('Proration Calculator', content, onSave);
    }

    function showSelectionModal(title, options, onSelect) {
        const content = el('div', {}, [
          el('div', { style: 'margin-bottom: 16px' }, [
            'Select an option:'
          ]),
          el('div', { style: 'display: flex; flex-direction: column; gap: 8px' }, 
            options.map(option => 
              el('button', { 
          class: 'btn',
                style: 'justify-content: flex-start',
                onclick: () => { onSelect(option); document.body.removeChild(overlay); }
              }, [option])
            )
          )
        ]);
        
        const overlay = el('div', { class: 'modal-overlay' }, [
          el('div', { class: 'modal' }, [
            el('h3', {}, [title]),
            content
          ])
        ]);
        
      document.body.appendChild(overlay);
      }
      
      function editLender(credit) {
        const content = el('div', {}, [
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Lender Name']),
            el('input', { 
              type: 'text', 
              value: credit.lender || '',
              oninput: e => credit.lender = e.target.value
            })
          ]),
          el('div', { style: 'margin-bottom: 16px' }, [
            el('label', { style: 'display: block; margin-bottom: 6px; font-weight: 600' }, ['Loan Number']),
            el('input', { 
              type: 'text', 
              value: credit.loanNumber || '',
              oninput: e => credit.loanNumber = e.target.value
            })
          ])
        ]);
        
        showModal('Edit Lender Information', content, () => render());
      }
      
      // ==================== DATA INITIALIZATION ====================
    function initializeData() {
        if (state.credits.length === 0) {
          SECTIONS.forEach(section => {
            state.credits.push({
              id: ++idxCounter,
              section: section.key,
              description: '',
              amount: 0,
              lender: '',
              loanNumber: '',
              prorationDays: PRORATION_DEFAULTS[section.key]?.days || 30,
              prorationRate: PRORATION_DEFAULTS[section.key]?.rate || 0.06
            });
          });
        }
      }
      
      // ==================== INPUT HANDLERS ====================
      function moneyInput(e) {
        const input = e.target;
        const value = input.value;
        
        // Remove any non-numeric characters except decimal point
        const cleaned = value.replace(/[^\d.-]/g, '');
        
        // Ensure only one decimal point
        const parts = cleaned.split('.');
        if (parts.length > 2) {
          input.value = parts[0] + '.' + parts.slice(1).join('');
        } else {
          input.value = cleaned;
        }
        
        // Update the state
        const credit = state.credits.find(c => c.id === parseInt(input.dataset.creditId));
        if (credit) {
          credit.amount = toNum(input.value);
        }
        
        // Update totals
        updateTotals();
      }
      
      // ==================== TABBING SYSTEM ====================
    function setupTabbing() {
        const inputs = $$('input[type="text"], input[type="number"], select');
        inputs.forEach((input, index) => {
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
          e.preventDefault();
              const nextIndex = e.shiftKey ? index - 1 : index + 1;
              if (nextIndex >= 0 && nextIndex < inputs.length) {
                inputs[nextIndex].focus();
              }
            }
          });
        });
      }
      
      // ==================== RENDER FUNCTIONS ====================
      function createSection(sectionKey) {
        const section = SECTIONS.find(s => s.key === sectionKey);
        const credits = state.credits.filter(c => c.section === sectionKey);
        
        const sectionEl = el('div', { class: 'section' }, [
          el('h2', {}, [`${section.icon} ${section.label}`])
        ]);
        
        if (credits.length === 0) {
          sectionEl.appendChild(el('div', { 
            style: 'text-align: center; color: #6b7280; padding: 20px' 
          }, ['No credits added yet.']));
          return sectionEl;
        }
        
        // Header row
        const headerRow = el('div', { class: 'row header' }, [
          el('div', {}, ['Description']),
          el('div', {}, ['Lender/Loan']),
          el('div', {}, ['Amount']),
          el('div', {}, ['Proration']),
          el('div', {}, ['Actions'])
        ]);
        
        sectionEl.appendChild(headerRow);
        
        // Credit rows
        credits.forEach(credit => {
          const row = el('div', { class: 'row' }, [
            el('div', {}, [
              el('input', {
                type: 'text',
                value: credit.description || '',
                placeholder: 'Enter description',
                oninput: e => credit.description = e.target.value,
                onkeydown: e => { if (e.key === 'Enter') e.target.blur(); }
              })
            ]),
            el('div', {}, [
              el('div', { style: 'display: flex; gap: 4px; align-items: center' }, [
                el('input', {
                  type: 'text',
                  value: credit.lender || '',
                  placeholder: 'Lender',
                  style: 'flex: 1',
                  oninput: e => credit.lender = e.target.value
                }),
                el('button', {
            class: 'btn edit',
                  style: 'padding: 4px 8px; font-size: 12px',
                  onclick: () => editLender(credit),
            title: 'Edit lender details'
                }, ['✏️'])
              ])
            ]),
            el('div', {}, [
              el('input', {
                type: 'number',
                step: MONEY_STEP,
                value: credit.amount || 0,
                'data-credit-id': credit.id,
                oninput: moneyInput,
                class: credit.amount < 0 ? 'negative' : credit.amount > 0 ? 'positive' : ''
              })
            ]),
            el('div', {}, [
              el('button', {
                class: 'btn calc',
                style: 'padding: 4px 8px; font-size: 12px',
                onclick: () => showProrationModal(credit, () => render())
              }, ['📊'])
            ]),
            el('div', {}, [
              el('button', {
              class: 'btn danger', 
                style: 'padding: 4px 8px; font-size: 12px',
              onclick: () => { 
                  const index = state.credits.findIndex(c => c.id === credit.id);
                  if (index > -1) {
                    state.credits.splice(index, 1);
                render(); 
                  }
                }
              }, ['🗑️'])
            ])
          ]);
          
          sectionEl.appendChild(row);
        });
        
        // Add new credit button
        const addButton = el('div', { style: 'margin-top: 12px' }, [
            el('button', {
              class: 'btn primary', 
              onclick: () => {
              state.credits.push({
                id: ++idxCounter,
                section: sectionKey,
                description: '',
                amount: 0,
                lender: '',
                loanNumber: '',
                prorationDays: PRORATION_DEFAULTS[sectionKey]?.days || 30,
                prorationRate: PRORATION_DEFAULTS[sectionKey]?.rate || 0.06
                }); 
                render(); 
            }
          }, ['+ Add Credit'])
        ]);
        
        sectionEl.appendChild(addButton);
        
        return sectionEl;
      }
      
      function updateTotals() {
        const totals = SECTIONS.reduce((acc, section) => {
          acc[section.key] = state.credits
            .filter(c => c.section === section.key)
            .reduce((sum, c) => sum + (c.amount || 0), 0);
          return acc;
        }, {});
        
        const grandTotal = Object.values(totals).reduce((sum, total) => sum + total, 0);
        
        // Update total displays
        $$('.section-total').forEach(el => {
          const section = el.dataset.section;
          const total = totals[section] || 0;
          el.textContent = `$${toMoney(total)}`;
          el.className = `section-total ${total < 0 ? 'negative' : total > 0 ? 'positive' : ''}`;
        });
        
        // Update grand total
        const grandTotalEl = $('#grandTotal');
        if (grandTotalEl) {
          grandTotalEl.textContent = `$${toMoney(grandTotal)}`;
          grandTotalEl.className = `grand-total ${grandTotal < 0 ? 'negative' : grandTotal > 0 ? 'positive' : ''}`;
        }
    }

    function render() {
        const root = $('#fundingCreditsApp');
        root.innerHTML = '';
        
        // Add header actions
        const headerActions = el('div', { 
          class: 'section',
          style: 'background: #f8f9fb; margin-bottom: 16px;'
        }, [
          el('h2', {}, ['💰 Funding Credits v1.8.2']),
          el('div', { class: 'btn-group' }, [
            el('button', { 
              class: 'btn primary', 
              onclick: 'fundingCreditsApp.saveData()' 
            }, ['💾 Save Credits']),
            el('input', { 
              type: 'file', 
              id: 'creditsFileInput', 
              accept: '.json', 
              style: 'display:none', 
              onchange: 'fundingCreditsApp.loadData(event)' 
            }),
            el('button', { 
              class: 'btn', 
              onclick: 'document.getElementById("creditsFileInput").click()' 
            }, ['📂 Load Credits']),
            el('button', { 
              class: 'btn danger', 
              onclick: 'fundingCreditsApp.clearCredits()' 
            }, ['🗑️ Clear All'])
          ])
        ]);
        
        root.appendChild(headerActions);
        
        // Add sections
        SECTIONS.forEach(section => {
          root.appendChild(createSection(section.key));
        });
        
        // Add totals section
        const totalsSection = el('div', { class: 'section' }, [
          el('h2', {}, ['📊 Totals']),
          el('div', { style: 'display: grid; grid-template-columns: 1fr 1fr; gap: 16px' }, [
            el('div', {}, [
              el('h3', { style: 'margin: 0 0 8px 0; font-size: 16px' }, ['Section Totals']),
              ...SECTIONS.map(section => {
                const total = state.credits
                  .filter(c => c.section === section.key)
                  .reduce((sum, c) => sum + (c.amount || 0), 0);
                
                return el('div', { 
                  style: 'display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #e5e7eb' 
                }, [
                  el('span', {}, [section.label]),
                  el('span', { 
                    class: 'section-total',
                    'data-section': section.key,
                    style: `font-weight: 600; ${total < 0 ? 'color: #dc2626' : total > 0 ? 'color: #16a34a' : ''}`
                  }, [`$${toMoney(total)}`])
                ]);
              })
            ]),
            el('div', {}, [
              el('h3', { style: 'margin: 0 0 8px 0; font-size: 16px' }, ['Grand Total']),
              el('div', { 
                style: 'font-size: 24px; font-weight: 700; text-align: center; padding: 20px; background: #f8f9fb; border-radius: 8px' 
              }, [
                el('span', { 
                  id: 'grandTotal',
                  class: 'grand-total'
                }, ['$0.00'])
              ])
            ])
          ])
        ]);
        
        root.appendChild(totalsSection);
        
        // Update totals
        updateTotals();
        
        // Setup tabbing
        setTimeout(setupTabbing, 100);
        
        // Focus after render
      if (focusAfterRender) {
          const element = $(focusAfterRender);
          if (element) {
            element.focus();
        focusAfterRender = null;
          }
      }
    }

      // ==================== EXPORT FUNCTIONS ====================
    function prepareExport() {
        return {
          version: '1.8.2',
          timestamp: new Date().toISOString(),
          credits: state.credits.map(credit => ({
            ...credit,
            amount: toNum(credit.amount)
          }))
        };
      }
      
      // ==================== PUBLIC API ====================
      return {
        saveData() {
      const data = prepareExport();
          const dataStr = JSON.stringify(data, null, 2);
          const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
          const fileName = originalFilename || `funding-credits-${new Date().toISOString().split('T')[0]}.json`;
          
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
      URL.revokeObjectURL(url);

          alert('Funding credits saved successfully!');
        },
        
        loadData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      originalFilename = file.name;
          
          const reader = new FileReader();
          reader.onload = e => {
            try {
              const loadedData = JSON.parse(e.target.result);
              if (loadedData && Array.isArray(loadedData.credits)) {
                state.credits = loadedData.credits.map(credit => ({
                  ...credit,
                  amount: toNum(credit.amount)
                }));
                render();
                alert('Funding credits loaded successfully!');
              } else {
                alert('Invalid funding credits file format');
              }
            } catch (error) {
              alert(`Error loading file: ${error.message}`);
        }
      };
      reader.readAsText(file);
        },
        
        clearCredits() {
          if (confirm('Are you sure you want to clear all credits? This cannot be undone.')) {
            state.credits = [];
            originalFilename = null;
      render();
            alert('All credits cleared successfully!');
    }
        },

        init() {
    initializeData();
    render();
        },
        
        render: render
      };
  })();
    
    // Initialize the funding credits app
    document.addEventListener('DOMContentLoaded', function() {
      window.fundingCreditsApp.init();
    });
  </script>
</body>
</html>
